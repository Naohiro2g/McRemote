name: McRemote
version: ${project.version}
description: McRemote
database: false
main: club.code2create.mcremote.McRemote
api-version: ${plugin.apiVersion}
soft-depend:
  - LuckPerms
commands:
  mcremote:
    aliases: [mcr]
    description: McRemote
    usage: /mcremote pair <code> | hud on|off|toggle|legs|target|status|toggle-on-swap on|off
permissions:
  mcr.online:
    description: Allows paired McRemote clients to act while the player is online.
    default: false
  mcr.offline:
    description: Allows paired McRemote clients to act for offline/background building.
    default: false
  mcremote.admin:
    description: Allows explicit credential domain status/bootstrap/reset operations.
    default: op
