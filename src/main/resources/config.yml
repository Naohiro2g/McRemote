# port for Minecraft Remote (socket server)
api_port: 25575
# permission nodes and meta key of LuckPerms
luckperm_permissions:
  online: "mcr.online"  # permission node for online players
  offline: "mcr.offline"  # permission node for offline players
  build.range: "mcr.build.range"  # meta key for group
# if there is no LuckPerms, use this
default_build_range: 1000
# MC versions this server advertises as compatible in the hello handshake
# (protocol §8.1). Empty -> falls back to the running server version.
supported_mc_versions:
  - "1.21.11"
# Authentication (wire-format-design §6.5 / versioning-design §10.11.1).
# Authentication is enforced by default. Set this to false only for an explicit
# development override that needs token-less hello compatibility.
auth:
  enforcement: true            # hello requires a valid token (auth_required/token_invalid)
  pair_code_ttl_seconds: 120   # lifetime of the 6-digit pair_code (§6.5)
  session_token_ttl_seconds: 7200   # mcrs_ session token (~2h)
  max_sessions_per_uuid: 16    # item 7; same UUID concurrent hello sessions cap
  # long-lived credential lifecycle (platform-design §9). Relative paths are under
  # plugins/McRemote. They are independently mountable; do not nest one in the other.
  credential_store_path: "credential-store/snapshot.json"
  revocation_authority_path: "credential-revocations"
  max_long_lived_credentials_per_uuid: 16  # distinct from concurrent session limit

# Runtime limits below are implementation limits, not protocol constants.
# Older configs grouped them under "b5:" / "b7:". Those keys are still read when the
# new key is absent (with a warning) and will be ignored from the stable release.

# Per-connection queues.
connection:
  command_queue_capacity: 1024   # commands accepted but not yet executed
  response_queue_capacity: 64    # saturation fails the connection; frames are never dropped silently

# Event buffering for events.poll.
events:
  ring_capacity: 256        # events kept per connection
  ring_bytes: 262144        # byte budget of the event ring
  poll_default: 64          # applied when events.poll omits the options object
  poll_limit: 64            # hard server cap; larger client hints are reduced to this value

# Entity handles issued to clients.
entities:
  handle_capacity: 256
  nearby_max_radius: 64     # world.getNearbyEntities radius cap; can be lowered, never above 64
  nearby_max_entities: 64   # world.getNearbyEntities max_entities cap; can be lowered, never above 64

# Particle spawning.
particles:
  max_count: 1000           # upper bound of count for one spawnParticle

# Work admission budget (work units).
work:
  per_request: 4096
  per_session_tick: 4096
  per_player_tick: 8192
  global_per_tick: 32768

# Full-lightning admission. Rate gates are atomic and all values are measured in server ticks.
lightning:
  connection_cooldown_ticks: 20
  player_cooldown_ticks: 20
  global_per_tick: 2
  rolling_window_ticks: 20
  global_per_window: 8
