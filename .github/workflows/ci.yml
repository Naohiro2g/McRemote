name: Build

on:
  # タグプッシュによる自動トリガー（形式: v<mc-remote-version>）
  push:
    tags:
      - 'v*'
  # GitHub Actions の手動トリガー
  workflow_dispatch:

jobs:
  credential-contract:
    name: Credentials (${{ matrix.os }}, Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup test runtime
        id: test-runtime
        uses: actions/setup-java@v4.7.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Setup Java 21 compiler and Gradle runtime
        id: compiler
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Windows SQLite contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./gradlew.bat test -PtestJavaVersion=${{ matrix.java }}
          "-Dorg.gradle.java.installations.paths=${{ steps.compiler.outputs.path }},${{ steps.test-runtime.outputs.path }}"
          --tests club.code2create.mcremote.SqliteCredentialBackendTest
      - name: Linux and macOS file and SQLite contracts
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          ./gradlew test -PtestJavaVersion=${{ matrix.java }}
          "-Dorg.gradle.java.installations.paths=${{ steps.compiler.outputs.path }},${{ steps.test-runtime.outputs.path }}"
          --tests club.code2create.mcremote.SqliteCredentialBackendTest
          --tests club.code2create.mcremote.CredentialServiceTest
          --tests club.code2create.mcremote.CredentialDiagnosticsTest
          --tests club.code2create.mcremote.PairingManagerTest
      - name: Windows packaged native engine and parent-driver isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew.bat sqlitePackagingProbe -PtestJavaVersion=${{ matrix.java }} "-Dorg.gradle.java.installations.paths=${{ steps.compiler.outputs.path }},${{ steps.test-runtime.outputs.path }}" 2>&1 | Tee-Object -FilePath build/sqlite-packaging-probe.log
          exit $LASTEXITCODE
      - name: Linux and macOS packaged native engine and parent-driver isolation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./gradlew sqlitePackagingProbe -PtestJavaVersion=${{ matrix.java }} "-Dorg.gradle.java.installations.paths=${{ steps.compiler.outputs.path }},${{ steps.test-runtime.outputs.path }}" 2>&1 | tee build/sqlite-packaging-probe.log
      - name: Upload credential test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-tests-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            build/test-results/test/
            build/reports/tests/test/
            build/sqlite-packaging-probe.log
          if-no-files-found: error

  build-only:
    needs: credential-contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Extract versions from Gradle
        id: gradle_versions
        run: |
          MC_VERSION=$(./gradlew -q printMcVersion)
          PLUGIN_VERSION=$(./gradlew -q printPluginVersion)
          FULL_VERSION="${PLUGIN_VERSION}"
          echo "MC_VERSION=${MC_VERSION}" >> "${GITHUB_ENV}"
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> "${GITHUB_ENV}"
          echo "FULL_VERSION=${FULL_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          EXPECTED_TAG="v${FULL_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "release tag mismatch: expected ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew build

      - name: List build artifacts
        run: ls -la build/libs

      - name: Prepare candidate artifact
        run: |
          JAR_NAME="mc-remote-${FULL_VERSION}.jar"
          CANDIDATE_DIR="build/candidate"
          test -f "build/libs/${JAR_NAME}"
          install -d "${CANDIDATE_DIR}"
          cp "build/libs/${JAR_NAME}" "${CANDIDATE_DIR}/${JAR_NAME}"
          cp release/minecraft-targets.json "${CANDIDATE_DIR}/minecraft-targets.json"
          printf '%s\n' "${GITHUB_SHA}" > "${CANDIDATE_DIR}/source-commit.txt"
          (
            cd "${CANDIDATE_DIR}"
            sha256sum "${JAR_NAME}" > SHA256SUMS
          )

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          # Formal-release candidate selection is intentionally not defined here.
          name: mc-remote-candidate
          path: build/candidate/
          if-no-files-found: error

      # Server deployment and GitHub release publication are separate operator tasks.
