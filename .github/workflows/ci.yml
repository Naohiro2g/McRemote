name: Build

on:
  # タグプッシュによる自動トリガー（例: v1.21.4-0.6.14）
  push:
    tags:
      - 'v*'
  # GitHub Actions の手動トリガー
  workflow_dispatch:

jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Extract versions from Gradle
        id: gradle_versions
        run: |
          MC_VERSION=$(./gradlew -q printMcVersion)
          PLUGIN_VERSION=$(./gradlew -q printPluginVersion)
          FULL_VERSION="${MC_VERSION}-${PLUGIN_VERSION}"
          echo "MC_VERSION=${MC_VERSION}" >> $GITHUB_ENV
          echo "PLUGIN_VERSION=${PLUGIN_VERSION}" >> $GITHUB_ENV
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV

      - name: Build plugin
        run: ./gradlew build

      - name: List build artifacts
        run: ls -la build/libs

      - name: Prepare candidate artifact
        run: |
          JAR_NAME="mc-remote-${FULL_VERSION}.jar"
          CANDIDATE_DIR="build/candidate"
          test -f "build/libs/${JAR_NAME}"
          install -d "${CANDIDATE_DIR}"
          cp "build/libs/${JAR_NAME}" "${CANDIDATE_DIR}/${JAR_NAME}"
          printf '%s\n' "${GITHUB_SHA}" > "${CANDIDATE_DIR}/source-commit.txt"
          (
            cd "${CANDIDATE_DIR}"
            sha256sum "${JAR_NAME}" > SHA256SUMS
          )

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          # Formal-release candidate selection is intentionally not defined here.
          name: mc-remote-candidate
          path: build/candidate/
          if-no-files-found: error

      # Server deployment and GitHub release publication are separate operator tasks.
