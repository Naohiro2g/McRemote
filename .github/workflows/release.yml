name: Release

# 正式段階の固定trigger（knowledge DECISIONS 2026-09-06-02 / 2026-09-27-03）。
# human release ownerがGitHub Releaseを公開すると、同じtagのCI（ci.yml）が残したcandidate JARを
# 再buildせずに昇格する。b10以降のtitleはtagとcandidateの対応版宣言から作る。
# 新形式は固定Schemaと、同じReleaseの対象別検証recordを必須とする。
# workflow_dispatchは既存tagでの検証用。dry_run=trueならReleaseを変更しない。
# tagのCIが成功してからReleaseを公開する。CIが間に合わず失敗した場合は、workflow_dispatchで
# dry_run=falseを指定して再実行できる。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (v<mc-remote-version>; legacy MC-prefixed tags accepted)"
        required: true
      dry_run:
        description: "verify only; do not edit the Release or upload assets"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ github.event_name == 'release' && 'false' || inputs.dry_run }}
    steps:
      # Scripts come from the workflow's own ref; the tag is only used to resolve the commit,
      # so older tags (before these scripts existed) can be verified with workflow_dispatch.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install release validator
        run: python3 -m pip install -r scripts/requirements-release.txt

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*release*.py'

      - name: Resolve tag commit
        id: commit
        run: |
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag ${TAG} -> ${SHA}"

      - name: Find the successful CI run for the tag
        id: run
        run: |
          RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --branch "${TAG}" \
            --event push --status success --limit 1 --json databaseId -q '.[0].databaseId')"
          if [ -z "${RUN_ID}" ]; then
            echo "no successful ci.yml run for tag ${TAG}" >&2
            exit 1
          fi
          echo "id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "candidate run ${RUN_ID}"

      - name: Download candidate artifact (no rebuild)
        run: gh run download "${{ steps.run.outputs.id }}" --repo "${GITHUB_REPOSITORY}" -n mc-remote-candidate -D candidate

      - name: Derive release identity from tag
        id: identity
        run: python3 scripts/release_identity.py "${TAG}" --targets candidate/minecraft-targets.json --github-output "${GITHUB_OUTPUT}" --body-output candidate/minecraft-section.md

      - name: Verify candidate identity
        working-directory: candidate
        env:
          JAR: ${{ steps.identity.outputs.jar }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          test -f "${JAR}" || { echo "candidate does not contain ${JAR}" >&2; ls -la; exit 1; }
          test "$(cat source-commit.txt)" = "${SHA}" || {
            echo "candidate source $(cat source-commit.txt) != tag commit ${SHA}" >&2; exit 1; }
          sha256sum -c SHA256SUMS
          stat -c '%s %n' "${JAR}"

      - name: Download per-target verification records from this Release
        if: steps.identity.outputs.mc_target == ''
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from release_identity import load_targets
          from release_manifest_v2 import verification_filename
          from pathlib import Path
          for version in load_targets(Path("candidate/minecraft-targets.json")):
              subprocess.run(["gh", "release", "download", os.environ["TAG"], "--repo",
                              os.environ["GITHUB_REPOSITORY"], "--pattern", verification_filename(version),
                              "--dir", "candidate"], check=True)
          PY

      - name: Create and verify manifest.json
        env:
          JAR: ${{ steps.identity.outputs.jar }}
          SHA: ${{ steps.commit.outputs.sha }}
          MC_TARGET: ${{ steps.identity.outputs.mc_target }}
        run: |
          ARGS=()
          if [ -z "${MC_TARGET}" ]; then
            ARGS=(--schema-version 2 --declaration candidate/minecraft-targets.json)
            while IFS= read -r RECORD; do
              ARGS+=(--verification-record "candidate/${RECORD}")
            done < <(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from release_identity import load_targets
          from release_manifest_v2 import verification_filename
          for version in load_targets(Path("candidate/minecraft-targets.json")):
              print(verification_filename(version))
          PY
            )
          fi
          python3 scripts/create_release_manifest.py --release-tag "${TAG}" --source-commit "${SHA}" \
            --jar "candidate/${JAR}" --output candidate/manifest.json "${ARGS[@]}"
          cat candidate/manifest.json

      - name: Prepare release body from the same declaration
        if: steps.identity.outputs.mc_target == ''
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q '.body // ""' > candidate/release-body-original.md
          python3 scripts/prepare_release_body.py --body candidate/release-body-original.md \
            --section candidate/minecraft-section.md --output candidate/release-body.md

      - name: Set title and pre-release, attach assets
        env:
          TITLE: ${{ steps.identity.outputs.title }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
          JAR: ${{ steps.identity.outputs.jar }}
        run: |
          if [ "${PRERELEASE}" = "true" ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--prerelease=false)
          fi
          ASSETS=("candidate/${JAR}" candidate/manifest.json)
          if [ -f candidate/release-body.md ]; then
            FLAGS+=(--notes-file candidate/release-body.md)
            ASSETS+=(candidate/minecraft-targets.json)
          fi
          echo "title: ${TITLE}"
          echo "flags: ${FLAGS[*]}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: would run gh release edit ${TAG} --title \"${TITLE}\" ${FLAGS[*]}"
            echo "dry run: would upload ${ASSETS[*]} (verification records already present on this Release)"
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json name,isPrerelease,assets \
              -q '"current title: \(.name), prerelease: \(.isPrerelease), assets: \([.assets[].name] | join(", "))"'
            exit 0
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" "${FLAGS[@]}"
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" "${ASSETS[@]}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json name,isPrerelease,assets \
            -q '"title: \(.name), prerelease: \(.isPrerelease), assets: \([.assets[].name] | join(", "))"'
